defaults:
  - encoding
  - bpe_tokenizer
  - optimizer: adamw
  - criterion: cross_entropy
  - hardware: local
  - _self_

dataset:
  context_window: 2_048

train:
  data_path: ${encoding.save_path}/train/train.npy
  loader:
    batch_size: 64
    shuffle: True

val:
  data_path: ${encoding.save_path}/val/val.npy
  loader:
    batch_size: 32
    shuffle: False

model:
  epochs: 100
  vocab_size: ${bpe_tokenizer.vocab_size}
  d_model: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

checkpoint:
  enabled: true
  dir: checkpoints
  checkpoint_interval: 5
  save_best: true
  resume_path: null

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: llm-from-scratch
  log_model: true
  checkpoint_interval: 5
